# Producción (VPS). nginx + certbot corren en el HOST y hacen reverse proxy a
# la app en 127.0.0.1:3000. Variables sensibles en .env (no versionado).
services:
  db:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: destino_aupair
    volumes:
      - dbdata:/var/lib/mysql
    # Solo accesible dentro de la red de compose (no expuesto al mundo)
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_AUPAIR_HOST: db
      DB_AUPAIR_PORT: "3306"
      DB_AUPAIR_USER: root
      DB_AUPAIR_PASSWORD: ${DB_ROOT_PASSWORD}
      DB_AUPAIR_NAME: destino_aupair
      JWT_AUPAIR_SECRET: ${JWT_AUPAIR_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      NOTIF_EXCLUIR_EMAILS: ${NOTIF_EXCLUIR_EMAILS}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      # Documentos fuera de public/: se sirven autenticados por /api/documentos
      UPLOADS_DIR: /app/almacenamiento
    volumes:
      - uploads:/app/almacenamiento
    ports:
      - "127.0.0.1:3000:3000"   # solo localhost → nginx del host hace de proxy
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
  uploads:
